
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d20">
  <title>Connexion | B.E.R. Platform</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="auth-container">

    <header class="auth-header">
      <h1>B.E.R.</h1>
      <p>Business • Éducation • Relations professionnelles</p>
    </header>

    <section class="auth-card">

      <h2>Bienvenue sur B.E.R.</h2>
      <p>Connectez-vous ou créez votre compte.</p>

      <div class="auth-tabs">
        <button type="button" id="tabConnexion">
          Connexion
        </button>

        <button type="button" id="tabInscription">
          Inscription
        </button>
      </div>

      <form id="formConnexion">
        <h3>Se connecter</h3>

        <label for="emailConnexion">Adresse e-mail</label>
        <input
          type="email"
          id="emailConnexion"
          placeholder="Votre e-mail"
          required
        >

        <label for="passwordConnexion">Mot de passe</label>
        <input
          type="password"
          id="passwordConnexion"
          placeholder="Votre mot de passe"
          required
        >

        <button type="submit">Se connecter</button>

        <button type="button" id="forgotPassword">
          Mot de passe oublié ?
        </button>
      </form>

      <form id="formInscription" hidden>
        <h3>Créer un compte</h3>

        <label for="emailInscription">Adresse e-mail</label>
        <input
          type="email"
          id="emailInscription"
          placeholder="Votre e-mail"
          required
        >

        <label for="passwordInscription">Mot de passe</label>
        <input
          type="password"
          id="passwordInscription"
          placeholder="Minimum 8 caractères"
          minlength="8"
          required
        >

        <button type="submit">Créer mon compte</button>
      </form>

      <p id="authMessage" role="status"></p>

    </section>

    <footer>
      <p>© B.E.R. Platform — Version 0.0.0.1</p>
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase.js"></script>
  <script src="./auth.js"></script>
  <script>
(async () => {
  const resultat = await window.berSupabase.auth.getSession();

  console.log(
    "BER TEST SESSION :",
    resultat.data.session ? "SESSION ACTIVE" : "AUCUNE SESSION"
  );

  console.log("BER TEST ERREUR :", resultat.error);
})();
</script>
  <script src="./auth-page.js"></script>
  

</body>
</html>
